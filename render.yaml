services:
  - type: web
    name: mind-map-note-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # Comma-separated list of origins allowed to call this API — your
      # deployed frontend URL(s), e.g. https://mind-map-note.vercel.app.
      # See backend/main.py's ALLOWED_ORIGINS.
      - key: ALLOWED_ORIGINS
        sync: false
      # Turns on the YouTube connection test (/youtube/test). Pick a long
      # random value; leave it unset to keep the feature off. The cookies
      # file is added separately as a Secret File named youtube_cookies.txt.
      # See backend/youtube_probe.py.
      - key: YOUTUBE_ACCESS_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.15
